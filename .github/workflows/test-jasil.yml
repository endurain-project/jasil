name: Test jasil

on:
  push:
    branches:
      - master
      - main
    paths: &paths
      - jasil/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/scripts/check_module_coverage.py
      - .github/workflows/test-jasil.yml
  pull_request:
    branches:
      - master
      - main
    paths: *paths

permissions:
  contents: read

# Pinned rather than left to uv: this is the fast feedback job, and an
# interpreter chosen by whatever the runner resolved makes a failure that does
# not reproduce locally. The supported range is covered by `test-matrix-jasil`;
# this one runs the floor.
env:
  JOB_PYTHON: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jasil:
    name: jasil (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      - name: Sync dependencies
        run: uv sync --frozen --no-dev --group test --group lint --no-install-project --python "$JOB_PYTHON"

      - name: Check import boundaries
        run: uv run --no-sync --python "$JOB_PYTHON" lint-imports

      - name: Run tests
        run: uv run --no-sync --python "$JOB_PYTHON" pytest

      # ``fail_under`` is an average, and an average hides its worst case: this
      # package once reported 90% overall while the Redis event bus sat at 48%.
      # Those are exactly the modules that only run in production.
      - name: Check per-module coverage
        run: uv run --no-sync python .github/scripts/check_module_coverage.py

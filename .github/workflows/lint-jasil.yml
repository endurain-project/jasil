name: Lint jasil

on:
  push:
    branches:
      - master
      - main
    paths: &paths
      - jasil/**
      - tests/**
      - docs/**
      - README.md
      - pyproject.toml
      - uv.lock
      - .github/scripts/check_docs_api.py
      - .github/workflows/lint-jasil.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-jasil:
    name: jasil (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      - name: Sync dependencies
        run: uv sync --frozen --only-group lint

      - name: Lint check
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

  typecheck-jasil:
    name: jasil (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      - name: Sync dependencies
        # mypy needs every runtime dependency importable to resolve third-party
        # types — including the ones behind an extra (redis, boto3, fastapi,
        # requests, apscheduler, alembic) — plus the typecheck group (mypy + stubs).
        run: uv sync --frozen --no-dev --group typecheck --all-extras --no-install-project

      - name: Type check
        run: uv run --no-sync mypy

  typecheck-ty-jasil:
    name: jasil (ty, advisory)
    runs-on: ubuntu-latest
    # ty is pre-1.0 and runs beside mypy for evaluation: findings are reported
    # but never block a merge. mypy is the gate.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Sync dependencies
        # Same environment as the mypy job: ty resolves third-party types from it.
        run: uv sync --frozen --no-dev --group typecheck --all-extras --no-install-project

      - name: Type check (ty)
        run: uv run --no-sync ty check --python .venv

  docs-api-jasil:
    name: jasil (docs match the API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      - name: Sync dependencies
        # Every extra: the documentation covers modules behind one (`jasil.deps`
        # needs fastapi, `jasil.jobs.service` apscheduler, `jasil.migrations`
        # alembic), and an unimportable module reads as a missing symbol.
        run: uv sync --frozen --no-dev --all-extras

      # A rename that misses the prose leaves a snippet raising AttributeError on
      # a reader's first contact. Nothing else in CI reads the documentation.
      - name: Check every documented symbol exists
        run: uv run --no-sync python .github/scripts/check_docs_api.py

name: Deploy documentation

# ``dry-run`` only exists on ``workflow_dispatch``. On a push ``inputs.dry-run``
# is null, so every ``!= true`` guard below passes and the site deploys.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build docs but do not deploy
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'jasil/**/*.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      # mkdocstrings imports the package to render the API reference, so sync the
      # default dependencies plus the docs group and install the project itself.
      - name: Sync documentation dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --site-dir site

      - name: Configure GitHub Pages
        if: ${{ inputs.dry-run != true }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.dry-run != true }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: ${{ inputs.dry-run != true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Publish jasil

# Builds and publishes a release to PyPI when a ``v*`` tag is pushed. The
# unprivileged build job validates the release and uploads its artifacts; the
# separate ``pypi`` environment job receives OIDC permission only when it needs
# to generate PEP 740 attestations and publish through Trusted Publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify, but do not upload to PyPI
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # A tag that disagrees with the packaged version produces a release whose
      # artifact name does not match its tag - catch it before anything is
      # uploaded, because a PyPI version can never be re-used.
      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag_version="${TAG_REF#refs/tags/v}"
          project_version="$(uv version --short)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag v${tag_version} does not match pyproject version ${project_version}." >&2
            exit 1
          fi
          echo "Releasing version ${project_version}."

      - name: Verify the changelog documents this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section." >&2
            exit 1
          fi

      # The full gate runs on every PR, but a tag can point anywhere in history,
      # so re-run it here: a release must never ship code that does not pass.
      - name: Sync dependencies
        run: uv sync --frozen --no-dev --group test --group lint --group typecheck

      - name: Lint, type check and test
        run: |
          set -euo pipefail
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync lint-imports
          uv run --no-sync mypy
          uv run --no-sync pytest

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Verify package metadata renders on PyPI
        run: uvx twine check --strict dist/*

      # Prove the wheel is self-contained: install it into a clean environment
      # with no dev groups and no optional extras, then import and assemble it
      # from outside the repository (so the source tree cannot shadow it).
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          smoke_venv="$RUNNER_TEMP/smoke"
          uv venv "$smoke_venv"
          VIRTUAL_ENV="$smoke_venv" uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$smoke_venv" uv run --no-project python "$GITHUB_WORKSPACE/.github/scripts/smoke_import.py"

      - name: Generate SBOM (CycloneDX)
        run: uvx cyclonedx-py environment --output-format json --outfile dist/jasil-sbom.cdx.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jasil-dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jasil
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jasil-dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

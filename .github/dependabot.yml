# Dependabot keeps dependencies *fresh*; the separate `audit-jasil` workflow is
# what catches an advisory against a version already pinned. Both are needed.
#
# Updates are grouped so a week's worth of patch bumps arrives as one reviewable
# pull request rather than a dozen. `uv.lock` is regenerated by Dependabot's uv
# support, so the lockfile and `pyproject.toml` stay in step.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      # Matches the Conventional Commits check in `conventional-commits.yml`.
      prefix: chore
      include: scope
    groups:
      # The runtime dependency set is small and deliberate, so these are worth
      # reading individually rather than batching.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Every action is pinned to a commit SHA, so without this they never move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

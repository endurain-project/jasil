site_name: JASIL documentation
site_description: Just Another Substrate & Infrastructure Library
site_url: https://jasil.endurain.com/
repo_url: https://github.com/endurain-project/jasil
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            show_root_heading: true
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Providers & backends: providers-and-backends.md
  - Deployment profiles: deployment-profiles.md
  - Events & outbox: events-and-outbox.md
  - Durable jobs: durable-jobs.md
  - Observability: observability.md
  - API stability: api-stability.md
  - API Reference: api.md
